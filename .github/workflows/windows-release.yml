name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check tracked public tree
        shell: pwsh
        run: |
          python tools/check_public_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test with isolated demo state
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP "kv-agent-dashboard-demo"
          python run_dashboard.py --demo --preview-only --once --no-browser --state-dir $state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $state "frame.png") -PathType Leaf)) {
            throw "Demo smoke test did not create frame.png"
          }

      - name: Build one-file executable
        shell: pwsh
        run: |
          $pyinstallerArgs = @(
            "--clean",
            "--noconsole",
            "--onefile",
            "--name", "KV-Agent-Desk",
            "--noconfirm",
            "--icon", "agent_dashboard/assets/app.ico",
            "--hidden-import", "agent_dashboard.adapters.codex",
            "--hidden-import", "agent_dashboard.adapters.zcode",
            "--hidden-import", "agent_dashboard.adapters.zcode_quota",
            "--hidden-import", "agent_dashboard.adapters.antigravity",
            "--hidden-import", "webview.platforms.winforms",
            "--hidden-import", "webview.platforms.edgechromium",
            "--hidden-import", "pystray._win32",
            # Explicit public runtime assets only; never glob the assets directory.
            "--add-data", "agent_dashboard/assets/app.ico;agent_dashboard/assets",
            "--add-data", "agent_dashboard/assets/deepseek.png;agent_dashboard/assets",
            "run_dashboard.py"
          )
          python -m PyInstaller @pyinstallerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist/KV-Agent-Desk.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "PyInstaller did not create $exe"
          }

      - name: Packaged executable smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\KV-Agent-Desk.exe"
          $stateName = "kv-agent-dashboard-packaged-smoke-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $state = Join-Path $env:RUNNER_TEMP $stateName
          New-Item -ItemType Directory -Path $state -Force | Out-Null
          $arguments = @(
            "--demo",
            "--preview-only",
            "--once",
            "--no-browser",
            "--state-dir",
            ('"{0}"' -f $state)
          )
          $process = Start-Process -FilePath $exe -ArgumentList $arguments `
            -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          try {
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged executable smoke test exceeded 60 seconds"
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Packaged executable smoke test exited with code $($process.ExitCode)"
            }
          } finally {
            $process.Dispose()
          }
          $frame = Join-Path $state "frame.png"
          $stateJson = Join-Path $state "state.json"
          if (-not (Test-Path -LiteralPath $frame -PathType Leaf)) {
            throw "Packaged executable smoke test did not create frame.png"
          }
          if (-not (Test-Path -LiteralPath $stateJson -PathType Leaf)) {
            throw "Packaged executable smoke test did not create state.json"
          }
          $snapshot = Get-Content -LiteralPath $stateJson -Raw | ConvertFrom-Json
          if ($snapshot.demo -ne $true) {
            throw "Packaged executable smoke test state.json is not marked demo=true"
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          python tools/package_release.py --exe dist/KV-Agent-Desk.exe --output dist/KV-Agent-Desk-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          foreach ($file in @("dist/KV-Agent-Desk.exe", "dist/KV-Agent-Desk-windows-x64.zip")) {
            $name = [System.IO.Path]::GetFileName($file)
            $checksum = Join-Path (Split-Path -Parent $file) "${name}.sha256"
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText($checksum, "$hash  $name`n", [System.Text.Encoding]::ASCII)
          }

      - name: Upload executable, portable ZIP, and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KV-Agent-Desk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/KV-Agent-Desk.exe
            dist/KV-Agent-Desk.exe.sha256
            dist/KV-Agent-Desk-windows-x64.zip
            dist/KV-Agent-Desk-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download clean build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: KV-Agent-Desk-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-assets

      - name: Verify SHA-256 checksum
        working-directory: release-assets
        run: sha256sum --check KV-Agent-Desk.exe.sha256 KV-Agent-Desk-windows-x64.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$GH_TAG" \
            release-assets/KV-Agent-Desk.exe \
            release-assets/KV-Agent-Desk-windows-x64.zip \
            release-assets/KV-Agent-Desk.exe.sha256 \
            release-assets/KV-Agent-Desk-windows-x64.zip.sha256 \
            --repo "$GH_REPO" \
            --title "$GH_TAG" \
            --generate-notes \
            --verify-tag
