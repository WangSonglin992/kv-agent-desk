name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download, verify, and install Inno Setup 7.1.0 x64
        id: inno
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "kv-agent-desk-inno-7.1.0"
          $assetName = "innosetup-7.1.0-x64.exe"
          $assetPath = Join-Path $toolRoot $assetName
          $assetUrl = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          Invoke-WebRequest -Uri $assetUrl -OutFile $assetPath
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Pinned Inno Setup 7.1.0 installer was not downloaded"
          }
          gh release verify-asset is-7_1_0 $assetPath --repo jrsoftware/issrc
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup GitHub release attestation verification failed"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $assetPath
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Inno Setup Authenticode signature is invalid or has an unexpected publisher"
          }
          $compilerRoot = Join-Path $toolRoot "compiler"
          $installProcess = Start-Process -FilePath $assetPath -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER",
            ('/DIR="{0}"' -f $compilerRoot)
          ) -Wait -PassThru -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) {
            throw "Verified Inno Setup installer failed with exit code $($installProcess.ExitCode)"
          }
          $iscc = Join-Path $compilerRoot "ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "The Inno Setup compiler was not installed into RUNNER_TEMP"
          }
          $compilerVersion = (& $iscc --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -notmatch '(?<![0-9])7\.1\.0(?![0-9])') {
            throw "Expected Inno Setup 7.1.0 x64 compiler; got: $compilerVersion"
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, ("iscc_path={0}{1}" -f $iscc, [Environment]::NewLine), [System.Text.UTF8Encoding]::new($false))

      - name: Check tracked public tree
        shell: pwsh
        run: |
          python tools/check_public_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test with isolated demo state
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP "kv-agent-dashboard-demo"
          python run_dashboard.py --demo --preview-only --once --no-browser --state-dir $state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $state "frame.png") -PathType Leaf)) {
            throw "Demo smoke test did not create frame.png"
          }

      - name: Build one-file executable
        shell: pwsh
        run: |
          $pyinstallerArgs = @(
            "--clean",
            "--noconsole",
            "--onefile",
            "--name", "KV-Agent-Desk",
            "--noconfirm",
            "--icon", "agent_dashboard/assets/app.ico",
            "--hidden-import", "agent_dashboard.adapters.codex",
            "--hidden-import", "agent_dashboard.adapters.zcode",
            "--hidden-import", "agent_dashboard.adapters.zcode_quota",
            "--hidden-import", "agent_dashboard.adapters.antigravity",
            "--hidden-import", "webview.platforms.winforms",
            "--hidden-import", "webview.platforms.edgechromium",
            "--hidden-import", "pystray._win32",
            # Explicit public runtime assets only; never glob the assets directory.
            "--add-data", "agent_dashboard/assets/app.ico;agent_dashboard/assets",
            "--add-data", "agent_dashboard/assets/deepseek.png;agent_dashboard/assets",
            "--add-data", "agent_dashboard/assets/chatgpt.png;agent_dashboard/assets",
            "--add-data", "agent_dashboard/assets/glm.png;agent_dashboard/assets",
            "--add-data", "agent_dashboard/assets/google.png;agent_dashboard/assets",
            "run_dashboard.py"
          )
          python -m PyInstaller @pyinstallerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist/KV-Agent-Desk.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "PyInstaller did not create $exe"
          }

      - name: Packaged executable smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\KV-Agent-Desk.exe"
          $stateName = "kv-agent-dashboard-packaged-smoke-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $state = Join-Path $env:RUNNER_TEMP $stateName
          New-Item -ItemType Directory -Path $state -Force | Out-Null
          $arguments = @(
            "--demo",
            "--preview-only",
            "--once",
            "--no-browser",
            "--state-dir",
            ('"{0}"' -f $state)
          )
          $process = Start-Process -FilePath $exe -ArgumentList $arguments `
            -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          try {
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged executable smoke test exceeded 60 seconds"
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Packaged executable smoke test exited with code $($process.ExitCode)"
            }
          } finally {
            $process.Dispose()
          }
          $frame = Join-Path $state "frame.png"
          $stateJson = Join-Path $state "state.json"
          if (-not (Test-Path -LiteralPath $frame -PathType Leaf)) {
            throw "Packaged executable smoke test did not create frame.png"
          }
          if (-not (Test-Path -LiteralPath $stateJson -PathType Leaf)) {
            throw "Packaged executable smoke test did not create state.json"
          }
          $snapshot = Get-Content -LiteralPath $stateJson -Raw | ConvertFrom-Json
          if ($snapshot.demo -ne $true) {
            throw "Packaged executable smoke test state.json is not marked demo=true"
          }

      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          .\Build-Installer.ps1 -SkipAppBuild -IsccPath "${{ steps.inno.outputs.iscc_path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup install and reinstall smoke test
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("kv-agent-desk-setup-smoke-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $syntheticProfile = Join-Path $smokeRoot "synthetic-user"
          $state = Join-Path $syntheticProfile ".kv-agent-desk"
          $installDir = Join-Path (Join-Path $smokeRoot "programs") "My Agent Desk"
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist\KV-Agent-Desk-Setup.exe"
          New-Item -ItemType Directory -Path $state -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $state "ui-profiles") -Force | Out-Null
          New-Item -ItemType Directory -Path (Split-Path -Parent $installDir) -Force | Out-Null
          $syntheticFiles = @(
            (Join-Path $state "settings.json"),
            (Join-Path $state "subscriptions.json"),
            (Join-Path $state "history.json"),
            (Join-Path (Join-Path $state "ui-profiles") "synthetic-style.json")
          )
          [System.IO.File]::WriteAllText($syntheticFiles[0], '{"brightness":100,"rotation":180,"usb_enabled":true,"auto_start":false,"auto_update":true,"lcd_height":462,"codex_no_five_hour_limit":false,"ui_id":"synthetic-style"}')
          [System.IO.File]::WriteAllText($syntheticFiles[1], '{"version":1,"profiles":{"codex":{"plan_name":"Synthetic plan","plan_spec":"Synthetic spec","expires_at":""},"zcode":{"plan_name":"","plan_spec":"","expires_at":""},"antigravity":{"plan_name":"","plan_spec":"","expires_at":""}}}')
          [System.IO.File]::WriteAllText($syntheticFiles[2], '{"synthetic-history":true}')
          [System.IO.File]::WriteAllText($syntheticFiles[3], '{"schema_version":1,"id":"synthetic-style","name":"Synthetic style","layout":"paper","elements":{}}')
          $expectedHashes = @{}
          foreach ($file in $syntheticFiles) {
            $expectedHashes[$file] = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $savedUserProfile = $env:USERPROFILE
          try {
            $env:USERPROFILE = $syntheticProfile
            foreach ($attempt in 1..2) {
              $arguments = @(
                "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
                ('/DIR="{0}"' -f $installDir),
                "/MERGETASKS=!desktopicon,!autostart"
              )
              $process = Start-Process -FilePath $setup -ArgumentList $arguments -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
              if (-not $process.WaitForExit(120000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw "Setup install/reinstall smoke test exceeded 120 seconds"
              }
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                throw "Setup install/reinstall smoke test attempt $attempt exited with code $($process.ExitCode)"
              }
              $process.Dispose()

              if (-not (Test-Path -LiteralPath (Join-Path $installDir "KV-Agent-Desk.exe") -PathType Leaf)) {
                throw "Setup did not install KV-Agent-Desk.exe in the isolated RUNNER_TEMP directory"
              }
              foreach ($file in $syntheticFiles) {
                if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expectedHashes[$file]) {
                  throw "Setup changed a synthetic user-data file: $([System.IO.Path]::GetFileName($file))"
                }
              }
              $ini = Join-Path $state "installation.ini"
              if (-not (Test-Path -LiteralPath $ini -PathType Leaf)) {
                throw "Setup did not write the synthetic installation.ini record"
              }
              $iniBytes = [System.IO.File]::ReadAllBytes($ini)
              if ($iniBytes.Length -lt 2 -or $iniBytes[0] -ne 0xFF -or $iniBytes[1] -ne 0xFE) {
                throw "Setup installation.ini is not UTF-16 with a BOM"
              }
              $iniText = [System.IO.File]::ReadAllText($ini, [System.Text.Encoding]::Unicode)
              if ($iniText -notmatch '\[Installation\]' -or
                  $iniText -notmatch [regex]::Escape($installDir) -or
                  $iniText -notmatch 'DesktopShortcut=0' -or
                  $iniText -notmatch 'InstallerManaged=1') {
                throw "Setup metadata does not identify the isolated install directory"
              }
              $mirror = Get-ItemProperty -LiteralPath "HKCU:\Software\KV-Agent-Desk"
              if ($mirror.InstallDir -ne $installDir -or $mirror.DesktopShortcut -ne 0 -or $mirror.InstallerManaged -ne 1) {
                throw "Setup did not mirror the isolated installation preferences in HKCU"
              }
              $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8D8918EF-160F-4D1E-AE68-E168DB0AD2B9}_is1"
              $uninstallEntry = Get-ItemProperty -LiteralPath $uninstallKey
              $expectedLocation = [IO.Path]::GetFullPath($installDir).TrimEnd([char[]]@('\', '/'))
              $registeredLocation = [string]$uninstallEntry.InstallLocation
              try {
                $normalizedRegisteredLocation = [IO.Path]::GetFullPath($registeredLocation).TrimEnd([char[]]@('\', '/'))
              } catch {
                throw "Windows uninstall InstallLocation is invalid. Expected synthetic path '$expectedLocation'; received '$registeredLocation'."
              }
              if (-not [string]::Equals($normalizedRegisteredLocation, $expectedLocation, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Windows uninstall InstallLocation mismatch. Expected synthetic path '$expectedLocation'; received '$registeredLocation' (normalized '$normalizedRegisteredLocation')."
              }
            }

            $uninstaller = Join-Path $installDir "unins000.exe"
            $uninstallerLog = Join-Path $smokeRoot "uninstaller.log"
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
              ('/LOG="{0}"' -f $uninstallerLog)
            ) -WorkingDirectory $installDir -WindowStyle Hidden -Wait -PassThru
            $uninstallExitCode = $uninstallProcess.ExitCode
            $uninstallProcess.Dispose()
            if ($uninstallExitCode -ne 0) {
              Write-Output "Synthetic uninstaller diagnostic summary:"
              Write-Output ("USERPROFILE_matches_synthetic={0}" -f [string]::Equals($env:USERPROFILE, $syntheticProfile, [StringComparison]::OrdinalIgnoreCase))
              Write-Output ("synthetic_profile_exists={0}" -f (Test-Path -LiteralPath $syntheticProfile -PathType Container))
              Write-Output ("synthetic_state_exists={0}" -f (Test-Path -LiteralPath $state -PathType Container))
              Write-Output ("synthetic_installation_ini_exists={0}" -f (Test-Path -LiteralPath (Join-Path $state "installation.ini") -PathType Leaf))
              Write-Output ("synthetic_hkcu_mirror_exists={0}" -f (Test-Path -LiteralPath "HKCU:\Software\KV-Agent-Desk"))
              Write-Output ("synthetic_uninstall_entry_exists={0}" -f (Test-Path -LiteralPath $uninstallKey))
              Write-Output ("synthetic_install_dir_exists={0}" -f (Test-Path -LiteralPath $installDir -PathType Container))
              Write-Output ("uninstaller_exit_code={0}" -f $uninstallExitCode)
              if (Test-Path -LiteralPath $uninstallerLog -PathType Leaf) {
                $uninstallerLogText = [System.IO.File]::ReadAllText($uninstallerLog)
                if ($uninstallerLogText -match 'InitializeUninstall returned False; aborting\.') {
                  Write-Output "inno_marker=InitializeUninstall_returned_false"
                } elseif ($uninstallerLogText -match 'InitializeUninstall raised an exception \(fatal\)\.') {
                  Write-Output "inno_marker=InitializeUninstall_raised_exception"
                } else {
                  Write-Output "inno_marker=no_InitializeUninstall_failure_marker"
                }
              } else {
                Write-Output "inno_marker=uninstaller_log_missing"
              }
              $lifecycleDiagnostic = Join-Path $env:RUNNER_TEMP "kv-agent-installer-lifecycle-diagnostic.json"
              if (Test-Path -LiteralPath $lifecycleDiagnostic -PathType Leaf) {
                try {
                  $diagnostic = Get-Content -LiteralPath $lifecycleDiagnostic -Raw | ConvertFrom-Json -ErrorAction Stop
                  $allowedDiagnosticFields = @("mode", "exception_type", "traceback_functions", "reason")
                  $unexpectedFields = @($diagnostic.PSObject.Properties.Name | Where-Object { $_ -notin $allowedDiagnosticFields })
                  if ($unexpectedFields.Count -gt 0) {
                    Write-Output "runtime_lifecycle_diagnostic=unexpected_schema_values_suppressed"
                  } else {
                    $diagnosticMode = [string]$diagnostic.mode
                    if ($diagnosticMode -notin @("prepare", "finish", "uninstall")) { $diagnosticMode = "invalid" }
                    $diagnosticType = [string]$diagnostic.exception_type
                    if ($diagnosticType -notmatch '^[A-Za-z_][A-Za-z0-9_]{0,63}$') { $diagnosticType = "invalid" }
                    $diagnosticReason = [string]$diagnostic.reason
                    if ($diagnosticReason -notin @("not_owned", "exe_mismatch", "appid_mismatch", "registered_path_mismatch", "registration_clear_failed", "invalid_installation_record", "unclassified")) {
                      $diagnosticReason = "invalid"
                    }
                    $safeFunctionNames = @()
                    foreach ($functionName in @($diagnostic.traceback_functions)) {
                      if ($safeFunctionNames.Count -ge 20) { break }
                      if ($functionName -is [string] -and $functionName -match '^[A-Za-z_][A-Za-z0-9_]{0,63}$') {
                        $safeFunctionNames += $functionName
                      }
                    }
                    Write-Output ("runtime_lifecycle_mode={0}" -f $diagnosticMode)
                    Write-Output ("runtime_lifecycle_exception_type={0}" -f $diagnosticType)
                    Write-Output ("runtime_lifecycle_reason={0}" -f $diagnosticReason)
                    Write-Output ("runtime_lifecycle_traceback_functions={0}" -f ($safeFunctionNames -join ","))
                  }
                } catch {
                  Write-Output "runtime_lifecycle_diagnostic=invalid_json_values_suppressed"
                }
              } else {
                Write-Output "runtime_lifecycle_diagnostic=missing"
              }
              throw "Isolated Setup uninstall exited with code $uninstallExitCode"
            }
            if (Test-Path -LiteralPath $installDir) {
              throw "Setup uninstall left program files in the isolated installation directory"
            }
            if (-not (Test-Path -LiteralPath $state -PathType Container)) {
              throw "Setup uninstall removed the synthetic user-data directory"
            }
            foreach ($file in $syntheticFiles) {
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expectedHashes[$file]) {
                throw "Setup uninstall changed a synthetic user-data file"
              }
            }
            if (Test-Path -LiteralPath (Join-Path $state "installation.ini")) {
              throw "Setup uninstall did not clear its owned installation.ini record"
            }
            if (Test-Path -LiteralPath "HKCU:\Software\KV-Agent-Desk") {
              throw "Setup uninstall did not clear its mirrored HKCU installation record"
            }
            if (Test-Path -LiteralPath $uninstallKey) {
              throw "Setup uninstall left its Windows Apps uninstall entry"
            }
          } finally {
            $env:USERPROFILE = $savedUserProfile
          }

      - name: Upload synthetic installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KV-Agent-Desk-installer-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kv-agent-installer-lifecycle-diagnostic.json
            ${{ runner.temp }}/kv-agent-desk-setup-smoke-${{ github.run_id }}-${{ github.run_attempt }}/uninstaller.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Package portable ZIP
        shell: pwsh
        run: |
          python tools/package_release.py --exe dist/KV-Agent-Desk.exe --output dist/KV-Agent-Desk-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          foreach ($file in @("dist/KV-Agent-Desk.exe", "dist/KV-Agent-Desk-Setup.exe", "dist/KV-Agent-Desk-windows-x64.zip")) {
            $name = [System.IO.Path]::GetFileName($file)
            $checksum = Join-Path (Split-Path -Parent $file) "${name}.sha256"
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText($checksum, "$hash  $name`n", [System.Text.Encoding]::ASCII)
          }

      - name: Generate public update manifest
        shell: pwsh
        run: |
          python tools/create_update_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; from agent_dashboard import __version__; data=json.load(open('dist/KV-Agent-Desk.update.json')); assert data['tag_name']=='v'+__version__, 'Package and executable versions differ'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content -LiteralPath 'dist/KV-Agent-Desk.update.json' -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $manifest.tag_name -ne $env:GITHUB_REF_NAME) {
            throw 'Release tag and update manifest version differ'
          }

      - name: Upload executable, Setup installer, portable ZIP, and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KV-Agent-Desk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/KV-Agent-Desk.exe
            dist/KV-Agent-Desk.exe.sha256
            dist/KV-Agent-Desk-Setup.exe
            dist/KV-Agent-Desk-Setup.exe.sha256
            dist/KV-Agent-Desk.update.json
            dist/KV-Agent-Desk-windows-x64.zip
            dist/KV-Agent-Desk-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download clean build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: KV-Agent-Desk-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-assets

      - name: Verify SHA-256 checksum
        working-directory: release-assets
        run: sha256sum --check KV-Agent-Desk.exe.sha256 KV-Agent-Desk-Setup.exe.sha256 KV-Agent-Desk-windows-x64.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$GH_TAG" \
            release-assets/KV-Agent-Desk.exe \
            release-assets/KV-Agent-Desk-Setup.exe \
            release-assets/KV-Agent-Desk-windows-x64.zip \
            release-assets/KV-Agent-Desk.exe.sha256 \
            release-assets/KV-Agent-Desk-Setup.exe.sha256 \
            release-assets/KV-Agent-Desk.update.json \
            release-assets/KV-Agent-Desk-windows-x64.zip.sha256 \
            --repo "$GH_REPO" \
            --title "$GH_TAG" \
            --generate-notes \
            --verify-tag
