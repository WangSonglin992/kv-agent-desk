[project]
name = "kv-agent-dashboard"
version = "0.4.2"
description = "Local Windows agent dashboard for Thermalright KV 9.16 USB LCD"
requires-python = ">=3.12"
dependencies = ["Pillow>=10.4,<13", "pywebview==6.2.1", "pystray==0.19.5"]

[project.scripts]
kv-agent-dashboard = "agent_dashboard.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_dashboard*"]

[tool.setuptools.package-data]
agent_dashboard = ["assets/app.ico", "assets/deepseek.png", "assets/deepseek.ico", "assets/deepseek.svg", "assets/chatgpt.png", "assets/glm.png", "assets/google.png", "assets/SOURCES.md"]
